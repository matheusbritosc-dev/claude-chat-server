version: '3.9'

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB:       shopee_automation
      POSTGRES_USER:     shopee_bot
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U shopee_bot -d shopee_automation"]
      interval: 10s
      timeout: 5s
      retries: 5

  app:
    build: .
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "3457:3457"
    env_file: .env
    environment:
      DB_HOST: db
      DB_PORT: 5432
    volumes:
      - ./tmp/videos:/app/tmp/videos
      - ./logs:/app/logs
      - ./assets:/app/assets
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:3457/api/status | grep -q '\"ok\":true'"]
      interval: 30s
      timeout: 10s
      retries: 3

volumes:
  pgdata:
