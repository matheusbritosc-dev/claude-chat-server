<!DOCTYPE html>
<html lang="pt-BR">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login | arOS</title>
  <meta name="description" content="Acesso ao arOS — Sistema Operacional de Agentes Resolutivos">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }
    :root {
      --bg: #0a0a0f; --surface: #16162a; --border: #2a2a45;
      --text: #e8e8f0; --muted: #9898b8; --accent: #c084fc; --accent-dark: #9333ea;
      --error: #f87171;
    }
    html, body { height: 100%; }
    body {
      font-family: 'Inter', -apple-system, sans-serif;
      background: var(--bg); color: var(--text);
      display: flex; align-items: center; justify-content: center; padding: 20px;
      overflow: hidden;
    }
    body::before {
      content: ''; position: fixed; inset: 0; z-index: 0; pointer-events: none;
      background:
        radial-gradient(ellipse at 20% 20%, rgba(124, 58, 237, 0.12) 0%, transparent 50%),
        radial-gradient(ellipse at 80% 80%, rgba(168, 85, 247, 0.10) 0%, transparent 50%);
      animation: pulse 8s ease-in-out infinite alternate;
    }
    @keyframes pulse { from { opacity: .6 } to { opacity: 1 } }
    .card {
      position: relative; z-index: 1; width: 100%; max-width: 400px;
      background: rgba(22, 22, 42, 0.7); backdrop-filter: blur(20px);
      border: 1px solid var(--border); border-radius: 24px;
      padding: 40px 34px; box-shadow: 0 20px 60px rgba(0, 0, 0, 0.5);
    }
    .brand { display: flex; align-items: center; gap: 12px; margin-bottom: 28px; }
    .logo {
      width: 48px; height: 48px; border-radius: 14px;
      background: linear-gradient(135deg, #7c3aed, #a855f7); color: #fff;
      display: flex; align-items: center; justify-content: center;
      font-size: 22px; font-weight: 800; box-shadow: 0 0 24px rgba(124, 58, 237, .4);
    }
    .brand h1 { font-size: 22px; font-weight: 800; letter-spacing: -.5px; }
    .brand p { font-size: 12px; color: var(--muted); }
    label { display: block; font-size: 13px; color: var(--muted); margin-bottom: 8px; }
    input {
      width: 100%; padding: 13px 15px; font-family: inherit; font-size: 15px;
      background: var(--bg); border: 1px solid var(--border); border-radius: 12px;
      color: var(--text); outline: none; transition: border-color .2s, box-shadow .2s;
    }
    input:focus { border-color: var(--accent-dark); box-shadow: 0 0 0 3px rgba(192, 132, 252, .15); }
    button {
      width: 100%; margin-top: 18px; padding: 14px; font-family: inherit;
      font-size: 15px; font-weight: 600; color: #fff; cursor: pointer;
      background: linear-gradient(135deg, #7c3aed, #a855f7); border: none;
      border-radius: 12px; transition: transform .15s, box-shadow .2s;
    }
    button:hover { transform: translateY(-1px); box-shadow: 0 8px 24px rgba(124, 58, 237, .35); }
    button:disabled { opacity: .5; cursor: not-allowed; transform: none; }
    .err { color: var(--error); font-size: 13px; margin-top: 14px; min-height: 18px; text-align: center; }
    .hint { margin-top: 22px; text-align: center; font-size: 11px; color: var(--muted); }
  </style>
</head>

<body>
  <form class="card" id="form">
    <div class="brand">
      <div class="logo">ar</div>
      <div>
        <h1>arOS</h1>
        <p>Sistema Operacional de Agentes Resolutivos</p>
      </div>
    </div>
    <label for="pw">Senha de acesso</label>
    <input id="pw" type="password" placeholder="••••••••" autocomplete="current-password" autofocus>
    <button type="submit" id="btn">Entrar</button>
    <div class="err" id="err"></div>
    <div class="hint">Área privada · acesso restrito</div>
  </form>

  <script>
    const form = document.getElementById('form');
    const pw = document.getElementById('pw');
    const btn = document.getElementById('btn');
    const err = document.getElementById('err');
    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      err.textContent = '';
      btn.disabled = true;
      try {
        const r = await fetch('/api/login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ password: pw.value })
        });
        const data = await r.json();
        if (data.success) { window.location.href = '/dashboard'; }
        else { err.textContent = data.error || 'Falha no login'; btn.disabled = false; }
      } catch (e) {
        err.textContent = 'Erro de conexão'; btn.disabled = false;
      }
    });
  </script>
</body>

</html>
