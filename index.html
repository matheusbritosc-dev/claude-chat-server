<!DOCTYPE html>
<html lang="pt-BR">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Claude Chat — IA de última geração</title>
  <meta name="description" content="Interface de bate-papo com o agente Claude AI">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,300;0,14..32,400;0,14..32,500;0,14..32,600;0,14..32,700;0,14..32,800;1,14..32,400&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/styles/atom-one-dark.min.css">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/highlight.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>

  <style>
    *, *::before, *::after {
      margin: 0; padding: 0; box-sizing: border-box;
    }

    :root {
      --bg-0: #06060e;
      --bg-1: #0d0d1a;
      --bg-2: #13132a;
      --bg-3: #1a1a36;
      --surface: #16163a;
      --surface-2: #1e1e42;
      --border: rgba(120, 80, 255, 0.12);
      --border-2: rgba(120, 80, 255, 0.25);
      --text-1: #f0f0ff;
      --text-2: #a0a0cc;
      --text-3: #606090;
      --accent: #7c3aed;
      --accent-2: #9b59f5;
      --accent-3: #c084fc;
      --accent-4: #e9d5ff;
      --neon: rgba(124, 58, 237, 0.6);
      --neon-soft: rgba(124, 58, 237, 0.15);
      --neon-glow: 0 0 30px rgba(124, 58, 237, 0.35), 0 0 60px rgba(124, 58, 237, 0.15);
      --user-gradient: linear-gradient(135deg, #5b21b6 0%, #7c3aed 50%, #a855f7 100%);
      --glass: rgba(13, 13, 26, 0.7);
      --glass-border: rgba(255, 255, 255, 0.06);
      --success: #10b981;
      --error: #ef4444;
      --r-sm: 8px; --r-md: 14px; --r-lg: 20px; --r-xl: 28px;
    }

    html, body {
      height: 100%;
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
      background: var(--bg-0);
      color: var(--text-1);
      overflow: hidden;
      -webkit-font-smoothing: antialiased;
    }

    body { display: flex; flex-direction: column; position: relative; }

    /* ── Canvas Background ── */
    #bg-canvas {
      position: fixed; inset: 0; z-index: 0;
      pointer-events: none;
    }

    /* ── Ambient orbs ── */
    .orb {
      position: fixed; border-radius: 50%; pointer-events: none; z-index: 0;
      filter: blur(80px); opacity: 0.35;
    }
    .orb-1 {
      width: 600px; height: 600px; top: -200px; left: -150px;
      background: radial-gradient(circle, #5b21b6 0%, transparent 70%);
      animation: orbFloat1 12s ease-in-out infinite;
    }
    .orb-2 {
      width: 500px; height: 500px; bottom: -150px; right: -100px;
      background: radial-gradient(circle, #7c3aed 0%, transparent 70%);
      animation: orbFloat2 15s ease-in-out infinite;
    }
    .orb-3 {
      width: 350px; height: 350px; top: 40%; left: 60%;
      background: radial-gradient(circle, #3b0764 0%, transparent 70%);
      opacity: 0.2;
      animation: orbFloat3 18s ease-in-out infinite;
    }
    @keyframes orbFloat1 {
      0%, 100% { transform: translate(0, 0) scale(1); }
      33% { transform: translate(60px, 40px) scale(1.05); }
      66% { transform: translate(-30px, 80px) scale(0.95); }
    }
    @keyframes orbFloat2 {
      0%, 100% { transform: translate(0, 0) scale(1); }
      50% { transform: translate(-80px, -60px) scale(1.08); }
    }
    @keyframes orbFloat3 {
      0%, 100% { transform: translate(0, 0); }
      33% { transform: translate(-50px, 30px); }
      66% { transform: translate(40px, -60px); }
    }

    /* ── Grid overlay ── */
    .grid-overlay {
      position: fixed; inset: 0; z-index: 0; pointer-events: none;
      background-image:
        linear-gradient(rgba(120,80,255,0.03) 1px, transparent 1px),
        linear-gradient(90deg, rgba(120,80,255,0.03) 1px, transparent 1px);
      background-size: 60px 60px;
    }

    /* ── Header ── */
    #header {
      position: relative; z-index: 20;
      display: flex; align-items: center; justify-content: space-between;
      padding: 14px 28px;
      background: var(--glass);
      backdrop-filter: blur(24px) saturate(1.5);
      border-bottom: 1px solid var(--glass-border);
      flex-shrink: 0;
      box-shadow: 0 1px 0 rgba(120,80,255,0.08);
    }

    .header-left { display: flex; align-items: center; gap: 16px; }

    .logo {
      position: relative;
      width: 42px; height: 42px;
      border-radius: var(--r-md);
      background: var(--user-gradient);
      display: flex; align-items: center; justify-content: center;
      font-size: 20px;
      box-shadow: var(--neon-glow);
      flex-shrink: 0;
    }
    .logo::after {
      content: '';
      position: absolute; inset: -1px;
      border-radius: inherit;
      background: var(--user-gradient);
      opacity: 0.4;
      filter: blur(8px);
      z-index: -1;
      animation: logoPulse 3s ease-in-out infinite;
    }
    @keyframes logoPulse {
      0%, 100% { opacity: 0.4; transform: scale(1); }
      50% { opacity: 0.7; transform: scale(1.1); }
    }

    .header-info {}
    .header-info h1 {
      font-size: 17px; font-weight: 700; letter-spacing: -0.4px;
      background: linear-gradient(135deg, var(--text-1) 0%, var(--accent-3) 100%);
      -webkit-background-clip: text; -webkit-text-fill-color: transparent;
      line-height: 1.2;
    }
    .header-info p {
      font-size: 11px; color: var(--text-3); font-weight: 400; margin-top: 2px;
    }

    .header-right { display: flex; align-items: center; gap: 10px; }

    .status-pill {
      display: flex; align-items: center; gap: 6px;
      padding: 6px 12px;
      border-radius: 20px;
      background: rgba(16, 185, 129, 0.08);
      border: 1px solid rgba(16, 185, 129, 0.2);
      font-size: 11px; font-weight: 600; color: var(--success);
      letter-spacing: 0.3px;
    }
    .status-dot {
      width: 6px; height: 6px; border-radius: 50%; background: var(--success);
      animation: pulse 2s ease-in-out infinite;
    }
    @keyframes pulse {
      0%, 100% { opacity: 1; box-shadow: 0 0 0 0 rgba(16,185,129,0.4); }
      50% { opacity: 0.7; box-shadow: 0 0 0 4px rgba(16,185,129,0); }
    }

    .btn-ghost {
      width: 36px; height: 36px;
      border-radius: var(--r-sm);
      background: transparent;
      border: 1px solid var(--glass-border);
      color: var(--text-3);
      cursor: pointer;
      display: flex; align-items: center; justify-content: center;
      font-size: 15px;
      transition: all 0.2s ease;
    }
    .btn-ghost:hover {
      background: var(--neon-soft);
      border-color: var(--border-2);
      color: var(--accent-3);
    }

    /* ── Chat area ── */
    #chat-area {
      position: relative; z-index: 5;
      flex: 1; overflow-y: auto;
      padding: 32px 24px;
      scroll-behavior: smooth;
    }
    #chat-area::-webkit-scrollbar { width: 4px; }
    #chat-area::-webkit-scrollbar-track { background: transparent; }
    #chat-area::-webkit-scrollbar-thumb { background: var(--border-2); border-radius: 4px; }

    .messages-container {
      max-width: 840px; margin: 0 auto;
      display: flex; flex-direction: column; gap: 24px;
    }

    /* ── Welcome ── */
    .welcome {
      text-align: center;
      padding: 64px 20px 48px;
      opacity: 0;
    }
    .welcome.visible { opacity: 1; }

    .welcome-badge {
      display: inline-flex; align-items: center; gap: 6px;
      padding: 5px 14px; border-radius: 20px;
      background: var(--neon-soft);
      border: 1px solid var(--border-2);
      font-size: 11px; font-weight: 600; color: var(--accent-3);
      letter-spacing: 0.5px; text-transform: uppercase;
      margin-bottom: 28px;
    }

    .welcome h2 {
      font-size: clamp(32px, 5vw, 52px);
      font-weight: 800;
      letter-spacing: -1.5px;
      line-height: 1.1;
      margin-bottom: 16px;
      background: linear-gradient(135deg, var(--text-1) 0%, var(--accent-3) 60%, var(--accent-2) 100%);
      -webkit-background-clip: text; -webkit-text-fill-color: transparent;
    }

    .welcome p {
      font-size: 16px; color: var(--text-2); max-width: 500px;
      margin: 0 auto 36px; line-height: 1.65; font-weight: 400;
    }

    .suggestions-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 10px;
      max-width: 560px;
      margin: 0 auto;
    }

    .suggestion-card {
      padding: 14px 16px;
      border-radius: var(--r-md);
      background: var(--surface);
      border: 1px solid var(--border);
      color: var(--text-2);
      font-size: 13px; font-family: inherit;
      cursor: pointer;
      text-align: left;
      transition: all 0.25s cubic-bezier(0.34, 1.56, 0.64, 1);
      display: flex; align-items: flex-start; gap: 10px;
      line-height: 1.45;
    }
    .suggestion-card .s-icon {
      font-size: 18px; flex-shrink: 0; margin-top: 1px;
    }
    .suggestion-card .s-text { flex: 1; }
    .suggestion-card .s-text strong { display: block; font-size: 12px; font-weight: 600; color: var(--text-1); margin-bottom: 2px; }
    .suggestion-card:hover {
      background: var(--surface-2);
      border-color: var(--border-2);
      color: var(--accent-4);
      transform: translateY(-2px);
      box-shadow: 0 8px 24px rgba(124,58,237,0.12);
    }

    /* ── Messages ── */
    .message {
      display: flex; gap: 14px;
      opacity: 0; transform: translateY(16px);
    }
    .message.visible {
      opacity: 1; transform: translateY(0);
      transition: opacity 0.35s ease, transform 0.35s cubic-bezier(0.34, 1.3, 0.64, 1);
    }
    .message.user { flex-direction: row-reverse; }

    .avatar {
      width: 36px; height: 36px;
      border-radius: var(--r-sm);
      display: flex; align-items: center; justify-content: center;
      font-size: 16px; flex-shrink: 0; margin-top: 2px;
    }
    .message.user .avatar {
      background: var(--user-gradient);
      box-shadow: 0 0 20px rgba(124,58,237,0.25);
    }
    .message.claude .avatar {
      background: linear-gradient(135deg, #92400e, #d97706);
      box-shadow: 0 0 20px rgba(217,119,6,0.2);
    }

    .message-body { max-width: 78%; min-width: 0; }

    .message-content {
      padding: 14px 18px;
      border-radius: var(--r-lg);
      font-size: 14px; line-height: 1.75;
      word-wrap: break-word; overflow-wrap: break-word;
    }
    .message.user .message-content {
      background: var(--user-gradient);
      color: #fff;
      border-bottom-right-radius: 4px;
      box-shadow: 0 4px 20px rgba(124,58,237,0.2);
    }
    .message.claude .message-content {
      background: var(--surface);
      border: 1px solid var(--border);
      border-bottom-left-radius: 4px;
      box-shadow: 0 2px 12px rgba(0,0,0,0.2);
    }

    /* Markdown inside messages */
    .message-content pre {
      margin: 12px 0; border-radius: var(--r-sm); overflow: hidden;
    }
    .message-content pre > code.hljs {
      padding: 16px; font-size: 12.5px;
      background: #0d0d1a !important;
      border: 1px solid rgba(255,255,255,0.06);
    }
    .message-content code:not(pre code) {
      font-family: 'JetBrains Mono', monospace;
      font-size: 12.5px;
      background: rgba(124,58,237,0.12);
      padding: 2px 7px; border-radius: 4px;
      color: var(--accent-3);
    }
    .message-content p + p { margin-top: 10px; }
    .message-content ul, .message-content ol { margin: 8px 0; padding-left: 22px; }
    .message-content li { margin: 4px 0; }
    .message-content h1 { font-size: 20px; font-weight: 700; margin: 18px 0 10px; }
    .message-content h2 { font-size: 17px; font-weight: 700; margin: 14px 0 8px; }
    .message-content h3 { font-size: 15px; font-weight: 600; margin: 12px 0 6px; }
    .message-content strong { font-weight: 700; color: var(--accent-4); }
    .message-content em { font-style: italic; color: var(--text-2); }
    .message-content a { color: var(--accent-3); text-decoration: underline; text-underline-offset: 3px; }
    .message-content blockquote {
      border-left: 3px solid var(--accent);
      padding: 8px 14px; margin: 10px 0;
      background: rgba(124,58,237,0.06);
      border-radius: 0 var(--r-sm) var(--r-sm) 0;
      color: var(--text-2);
    }
    .message-content hr { border: none; border-top: 1px solid var(--border); margin: 14px 0; }
    .message-content table { width: 100%; border-collapse: collapse; margin: 12px 0; font-size: 13px; }
    .message-content th, .message-content td {
      padding: 8px 12px; text-align: left;
      border-bottom: 1px solid var(--border);
    }
    .message-content th { font-weight: 600; color: var(--accent-3); }

    .message-meta {
      display: flex; align-items: center; gap: 8px;
      font-size: 11px; color: var(--text-3); margin-top: 6px; padding: 0 4px;
    }
    .message.user .message-meta { justify-content: flex-end; }
    .cost-tag {
      background: var(--bg-2); padding: 1px 7px; border-radius: 8px;
      border: 1px solid var(--border); font-size: 10px;
    }

    /* ── Typing indicator ── */
    .typing-bubble {
      display: flex; gap: 14px; opacity: 0; transform: translateY(10px);
    }
    .typing-bubble.visible { opacity: 1; transform: translateY(0); transition: all 0.3s ease; }
    .typing-content {
      padding: 16px 20px;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--r-lg); border-bottom-left-radius: 4px;
      display: flex; align-items: center; gap: 10px;
    }
    .typing-dots { display: flex; gap: 5px; }
    .typing-dots span {
      width: 7px; height: 7px; border-radius: 50%; background: var(--accent-2);
      animation: dotBounce 1.4s ease-in-out infinite;
    }
    .typing-dots span:nth-child(2) { animation-delay: 0.16s; }
    .typing-dots span:nth-child(3) { animation-delay: 0.32s; }
    @keyframes dotBounce {
      0%, 60%, 100% { transform: translateY(0); opacity: 0.4; }
      30% { transform: translateY(-8px); opacity: 1; }
    }
    .typing-label { font-size: 12px; color: var(--text-3); font-style: italic; }

    /* ── Input area ── */
    #input-area {
      position: relative; z-index: 20;
      padding: 16px 24px 22px;
      background: var(--glass);
      backdrop-filter: blur(24px) saturate(1.5);
      border-top: 1px solid var(--glass-border);
      flex-shrink: 0;
    }

    .input-container { max-width: 840px; margin: 0 auto; }

    .input-box {
      display: flex; align-items: flex-end; gap: 10px;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--r-xl);
      padding: 8px 8px 8px 20px;
      transition: all 0.25s ease;
    }
    .input-box:focus-within {
      border-color: var(--accent);
      box-shadow: 0 0 0 3px rgba(124,58,237,0.12), 0 4px 24px rgba(0,0,0,0.25);
    }

    #message-input {
      flex: 1; background: none; border: none; outline: none;
      color: var(--text-1); font-family: inherit; font-size: 14px;
      line-height: 1.55; resize: none;
      min-height: 24px; max-height: 180px;
      padding: 8px 0;
    }
    #message-input::placeholder { color: var(--text-3); }

    #send-btn {
      width: 44px; height: 44px; border-radius: var(--r-md);
      background: var(--user-gradient); border: none;
      color: #fff; cursor: pointer;
      display: flex; align-items: center; justify-content: center;
      font-size: 18px; flex-shrink: 0;
      transition: all 0.2s cubic-bezier(0.34, 1.56, 0.64, 1);
      position: relative; overflow: hidden;
    }
    #send-btn::before {
      content: '';
      position: absolute; inset: 0;
      background: rgba(255,255,255,0.15);
      opacity: 0; transition: opacity 0.2s;
    }
    #send-btn:hover:not(:disabled) {
      transform: scale(1.08);
      box-shadow: var(--neon-glow);
    }
    #send-btn:hover::before { opacity: 1; }
    #send-btn:active:not(:disabled) { transform: scale(0.95); }
    #send-btn:disabled { opacity: 0.35; cursor: not-allowed; }

    .input-footer {
      display: flex; align-items: center; justify-content: space-between;
      margin-top: 10px; padding: 0 4px;
    }
    .input-hint { font-size: 11px; color: var(--text-3); }
    .input-hint kbd {
      background: var(--bg-2); padding: 2px 6px;
      border-radius: 4px; border: 1px solid var(--border);
      font-family: inherit; font-size: 10px;
    }
    .char-count { font-size: 11px; color: var(--text-3); }

    /* ── Toast ── */
    .toast {
      position: fixed; bottom: 110px; left: 50%; transform: translateX(-50%);
      padding: 10px 20px; border-radius: var(--r-md);
      font-size: 13px; backdrop-filter: blur(12px);
      z-index: 100; white-space: nowrap;
      animation: toastIn 0.3s ease-out;
    }
    .toast.error {
      background: rgba(239,68,68,0.12);
      border: 1px solid rgba(239,68,68,0.3);
      color: var(--error);
    }
    @keyframes toastIn {
      from { opacity: 0; transform: translateX(-50%) translateY(10px); }
      to { opacity: 1; transform: translateX(-50%) translateY(0); }
    }

    /* ── Responsive ── */
    @media (max-width: 640px) {
      #header { padding: 12px 16px; }
      #chat-area { padding: 20px 14px; }
      #input-area { padding: 12px 14px 18px; }
      .message-body { max-width: 88%; }
      .welcome h2 { letter-spacing: -0.8px; }
      .suggestions-grid { grid-template-columns: 1fr; }
      .header-info p { display: none; }
    }
  </style>
</head>

<body>
  <div class="orb orb-1"></div>
  <div class="orb orb-2"></div>
  <div class="orb orb-3"></div>
  <div class="grid-overlay"></div>
  <canvas id="bg-canvas"></canvas>

  <header id="header">
    <div class="header-left">
      <div class="logo">🤖</div>
      <div class="header-info">
        <h1>Claude Chat</h1>
        <p>Powered by Anthropic Claude &bull; claude-sonnet-4-6</p>
      </div>
    </div>
    <div class="header-right">
      <div class="status-pill">
        <div class="status-dot"></div>
        Online
      </div>
      <button class="btn-ghost" onclick="clearChat()" title="Nova conversa">🗑</button>
    </div>
  </header>

  <main id="chat-area">
    <div class="messages-container" id="messages">
      <div class="welcome" id="welcome">
        <div class="welcome-badge">✦ Inteligência Artificial</div>
        <h2>Como posso<br>te ajudar hoje?</h2>
        <p>Sou Claude, criada pela Anthropic. Posso ajudar com código, análises, escrita criativa, pesquisa e muito mais.</p>
        <div class="suggestions-grid">
          <button class="suggestion-card" onclick="sendSuggestion('Explique como funciona a inteligência artificial de forma simples')">
            <span class="s-icon">🧠</span>
            <span class="s-text"><strong>O que é IA?</strong>Explicação simples e clara</span>
          </button>
          <button class="suggestion-card" onclick="sendSuggestion('Escreva um código Python que gera uma senha segura com letras, números e símbolos')">
            <span class="s-icon">🐍</span>
            <span class="s-text"><strong>Código Python</strong>Gerar senha segura</span>
          </button>
          <button class="suggestion-card" onclick="sendSuggestion('Me dê 5 ideias criativas para um projeto de tecnologia que eu possa construir em um final de semana')">
            <span class="s-icon">💡</span>
            <span class="s-text"><strong>Ideias de projeto</strong>Para um fim de semana</span>
          </button>
          <button class="suggestion-card" onclick="sendSuggestion('Qual a diferença entre machine learning, deep learning e inteligência artificial?')">
            <span class="s-icon">📊</span>
            <span class="s-text"><strong>ML vs DL vs IA</strong>Diferenças explicadas</span>
          </button>
        </div>
      </div>
    </div>
  </main>

  <footer id="input-area">
    <div class="input-container">
      <div class="input-box">
        <textarea id="message-input" placeholder="Pergunte qualquer coisa..." rows="1"></textarea>
        <button id="send-btn" onclick="sendMessage()" disabled>
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
            <path d="M22 2L11 13M22 2L15 22 11 13 2 9l20-7z"/>
          </svg>
        </button>
      </div>
      <div class="input-footer">
        <span class="input-hint"><kbd>Enter</kbd> envia &bull; <kbd>Shift+Enter</kbd> nova linha</span>
        <span class="char-count" id="char-count"></span>
      </div>
    </div>
  </footer>

  <script>
    /* ── Canvas particle background ── */
    (function () {
      const canvas = document.getElementById('bg-canvas');
      const ctx = canvas.getContext('2d');
      let W, H, particles = [];

      function resize() {
        W = canvas.width = window.innerWidth;
        H = canvas.height = window.innerHeight;
      }

      function createParticles(n) {
        particles = [];
        for (let i = 0; i < n; i++) {
          particles.push({
            x: Math.random() * W,
            y: Math.random() * H,
            r: Math.random() * 1.4 + 0.4,
            vx: (Math.random() - 0.5) * 0.25,
            vy: (Math.random() - 0.5) * 0.25,
            o: Math.random() * 0.4 + 0.1,
          });
        }
      }

      function drawLines() {
        const limit = 130;
        for (let i = 0; i < particles.length; i++) {
          for (let j = i + 1; j < particles.length; j++) {
            const dx = particles[i].x - particles[j].x;
            const dy = particles[i].y - particles[j].y;
            const dist = Math.sqrt(dx * dx + dy * dy);
            if (dist < limit) {
              ctx.beginPath();
              ctx.strokeStyle = `rgba(124,58,237,${0.06 * (1 - dist / limit)})`;
              ctx.lineWidth = 0.6;
              ctx.moveTo(particles[i].x, particles[i].y);
              ctx.lineTo(particles[j].x, particles[j].y);
              ctx.stroke();
            }
          }
        }
      }

      function animate() {
        ctx.clearRect(0, 0, W, H);
        particles.forEach(p => {
          p.x += p.vx; p.y += p.vy;
          if (p.x < 0) p.x = W;
          if (p.x > W) p.x = 0;
          if (p.y < 0) p.y = H;
          if (p.y > H) p.y = 0;
          ctx.beginPath();
          ctx.arc(p.x, p.y, p.r, 0, Math.PI * 2);
          ctx.fillStyle = `rgba(180,130,255,${p.o})`;
          ctx.fill();
        });
        drawLines();
        requestAnimationFrame(animate);
      }

      resize();
      createParticles(70);
      animate();
      window.addEventListener('resize', () => { resize(); createParticles(70); });
    })();

    /* ── Welcome animation ── */
    window.addEventListener('DOMContentLoaded', () => {
      const welcome = document.getElementById('welcome');
      welcome.classList.add('visible');
      if (window.gsap) {
        gsap.from(welcome.querySelector('.welcome-badge'), { y: -20, opacity: 0, duration: 0.6, ease: 'power3.out' });
        gsap.from(welcome.querySelector('h2'), { y: 30, opacity: 0, duration: 0.7, delay: 0.1, ease: 'power3.out' });
        gsap.from(welcome.querySelector('p'), { y: 20, opacity: 0, duration: 0.6, delay: 0.25, ease: 'power3.out' });
        gsap.from('.suggestion-card', { y: 24, opacity: 0, duration: 0.5, stagger: 0.08, delay: 0.35, ease: 'back.out(1.4)' });
      }
    });

    /* ── Core chat logic ── */
    const messagesEl = document.getElementById('messages');
    const inputEl    = document.getElementById('message-input');
    const sendBtn    = document.getElementById('send-btn');
    const charCount  = document.getElementById('char-count');
    const welcomeEl  = document.getElementById('welcome');
    let streaming    = false;
    let convId       = null;

    inputEl.addEventListener('input', () => {
      inputEl.style.height = 'auto';
      inputEl.style.height = Math.min(inputEl.scrollHeight, 180) + 'px';
      const len = inputEl.value.trim().length;
      sendBtn.disabled = !len || streaming;
      charCount.textContent = len > 0 ? `${len}` : '';
    });

    inputEl.addEventListener('keydown', e => {
      if (e.key === 'Enter' && !e.shiftKey) {
        e.preventDefault();
        if (!streaming && inputEl.value.trim()) sendMessage();
      }
    });

    function now() {
      return new Date().toLocaleTimeString('pt-BR', { hour: '2-digit', minute: '2-digit' });
    }

    function esc(t) {
      const d = document.createElement('div');
      d.textContent = t;
      return d.innerHTML;
    }

    function renderMd(text) {
      let h = text;
      // fenced code blocks
      h = h.replace(/```(\w*)\n?([\s\S]*?)```/g, (_, lang, code) => {
        const safe = esc(code.trim());
        const highlighted = lang && hljs.getLanguage(lang)
          ? hljs.highlight(code.trim(), { language: lang }).value
          : hljs.highlightAuto(code.trim()).value;
        return `<pre><code class="hljs">${highlighted}</code></pre>`;
      });
      h = h.replace(/`([^`\n]+)`/g, '<code>$1</code>');
      h = h.replace(/\*\*\*(.+?)\*\*\*/g, '<strong><em>$1</em></strong>');
      h = h.replace(/\*\*(.+?)\*\*/g, '<strong>$1</strong>');
      h = h.replace(/\*(.+?)\*/g, '<em>$1</em>');
      h = h.replace(/^#{3} (.+)$/gm, '<h3>$1</h3>');
      h = h.replace(/^#{2} (.+)$/gm, '<h2>$1</h2>');
      h = h.replace(/^# (.+)$/gm, '<h1>$1</h1>');
      h = h.replace(/^> (.+)$/gm, '<blockquote>$1</blockquote>');
      h = h.replace(/^\s*[-*] (.+)$/gm, '<li>$1</li>');
      h = h.replace(/(<li>[\s\S]+?<\/li>)/g, '<ul>$1</ul>');
      h = h.replace(/^\d+\. (.+)$/gm, '<li>$1</li>');
      h = h.replace(/\[([^\]]+)\]\(([^)]+)\)/g, '<a href="$2" target="_blank" rel="noopener">$1</a>');
      h = h.replace(/^-{3,}$/gm, '<hr>');
      h = h.replace(/\n\n/g, '</p><p>');
      h = h.replace(/\n/g, '<br>');
      if (!h.startsWith('<')) h = '<p>' + h + '</p>';
      return h;
    }

    function addMessage(role, content) {
      if (welcomeEl) welcomeEl.style.display = 'none';
      const el = document.createElement('div');
      el.className = `message ${role}`;
      const icon  = role === 'user' ? '👤' : '🤖';
      const body  = role === 'claude' ? renderMd(content) : `<p>${esc(content)}</p>`;
      el.innerHTML = `
        <div class="avatar">${icon}</div>
        <div class="message-body">
          <div class="message-content">${body}</div>
          <div class="message-meta">
            <span>${now()}</span>
          </div>
        </div>`;
      messagesEl.appendChild(el);
      requestAnimationFrame(() => el.classList.add('visible'));
      scrollBottom();
      return el;
    }

    function showTyping() {
      const el = document.createElement('div');
      el.className = 'typing-bubble';
      el.id = 'typing';
      el.innerHTML = `
        <div class="avatar" style="background:linear-gradient(135deg,#92400e,#d97706);font-size:16px;width:36px;height:36px;border-radius:8px;display:flex;align-items:center;justify-content:center;flex-shrink:0;margin-top:2px">🤖</div>
        <div class="typing-content">
          <div class="typing-dots"><span></span><span></span><span></span></div>
          <span class="typing-label">Claude está pensando…</span>
        </div>`;
      messagesEl.appendChild(el);
      requestAnimationFrame(() => el.classList.add('visible'));
      scrollBottom();
    }

    function hideTyping() {
      const el = document.getElementById('typing');
      if (el) el.remove();
    }

    function scrollBottom() {
      const area = document.getElementById('chat-area');
      area.scrollTo({ top: area.scrollHeight, behavior: 'smooth' });
    }

    function toast(msg, type = 'error') {
      const el = document.createElement('div');
      el.className = `toast ${type}`;
      el.textContent = '⚠ ' + msg;
      document.body.appendChild(el);
      setTimeout(() => el.remove(), 5000);
    }

    function sendSuggestion(text) {
      inputEl.value = text;
      sendBtn.disabled = false;
      sendMessage();
    }

    async function sendMessage() {
      const text = inputEl.value.trim();
      if (!text || streaming) return;
      streaming = true;
      sendBtn.disabled = true;
      inputEl.value = '';
      inputEl.style.height = 'auto';
      charCount.textContent = '';

      addMessage('user', text);
      showTyping();

      try {
        const res = await fetch('/api/chat', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ message: text, conversationId: convId })
        });
        hideTyping();
        const data = await res.json();

        if (data.success && data.response) {
          const msgEl = addMessage('claude', data.response);
          if (data.sessionId) convId = data.sessionId;
          if (data.cost) {
            const meta = msgEl.querySelector('.message-meta');
            meta.innerHTML += `<span class="cost-tag">$${data.cost.toFixed(4)}</span>`;
          }
        } else if (data.error) {
          toast(data.error);
          addMessage('claude', '⚠️ Ocorreu um erro. Tente novamente.');
        } else {
          addMessage('claude', data.response || 'Resposta vazia recebida.');
        }
      } catch (err) {
        hideTyping();
        toast('Erro de conexão: ' + err.message);
        addMessage('claude', '⚠️ Erro de conexão. Verifique se o servidor está ativo.');
      } finally {
        streaming = false;
        sendBtn.disabled = !inputEl.value.trim();
        inputEl.focus();
      }
    }

    function clearChat() {
      convId = null;
      messagesEl.innerHTML = '';
      const w = document.createElement('div');
      w.className = 'welcome visible';
      w.id = 'welcome';
      w.innerHTML = `
        <div class="welcome-badge">✦ Nova conversa</div>
        <h2>Como posso<br>te ajudar?</h2>
        <p>Pronto para uma nova sessão. O que você gostaria de explorar?</p>
        <div class="suggestions-grid">
          <button class="suggestion-card" onclick="sendSuggestion('O que você pode fazer por mim?')">
            <span class="s-icon">🚀</span>
            <span class="s-text"><strong>Capacidades</strong>O que posso fazer</span>
          </button>
          <button class="suggestion-card" onclick="sendSuggestion('Escreva um código JavaScript de um timer regressivo')">
            <span class="s-icon">⏱</span>
            <span class="s-text"><strong>Código JS</strong>Timer regressivo</span>
          </button>
        </div>`;
      messagesEl.appendChild(w);
      if (window.gsap) {
        gsap.from(w.querySelectorAll('.welcome-badge, h2, p, .suggestion-card'), {
          y: 20, opacity: 0, duration: 0.5, stagger: 0.07, ease: 'power3.out'
        });
      }
    }

    inputEl.focus();
  </script>
</body>

</html>
