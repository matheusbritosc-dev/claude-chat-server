# nginx.conf — copie para /etc/nginx/sites-available/shopee-automation
# Ative com: sudo ln -s /etc/nginx/sites-available/shopee-automation /etc/nginx/sites-enabled/
# HTTPS:      sudo certbot --nginx -d SEU_DOMINIO.com

server {
    listen 80;
    server_name SEU_DOMINIO.com;

    # Certbot redirecionará para HTTPS automaticamente
    location /.well-known/acme-challenge/ { root /var/www/html; }

    location / { return 301 https://$host$request_uri; }
}

server {
    listen 443 ssl http2;
    server_name SEU_DOMINIO.com;

    # Certs gerenciados pelo certbot
    ssl_certificate     /etc/letsencrypt/live/SEU_DOMINIO.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/SEU_DOMINIO.com/privkey.pem;
    include             /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam         /etc/letsencrypt/ssl-dhparams.pem;

    # Segurança
    add_header X-Frame-Options DENY;
    add_header X-Content-Type-Options nosniff;

    # Vídeos: cache longo (o Meta baixa uma vez)
    location /videos/ {
        proxy_pass         http://127.0.0.1:3457;
        proxy_http_version 1.1;
        proxy_set_header   Host $host;
        proxy_read_timeout 120s;

        # Cache de vídeo no nginx
        proxy_cache_valid 200 7d;
        add_header        Cache-Control "public, max-age=604800";
    }

    # Webhooks e API
    location / {
        proxy_pass         http://127.0.0.1:3457;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;
        client_max_body_size 200M;
    }
}
